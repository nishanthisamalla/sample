name: Sync APIM Dev to Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  export-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Export API from DEV APIM (ARM)
        run: |
          az apim api export \
            --resource-group ${{ secrets.DEV_RG }} \
            --service-name ${{ secrets.DEV_APIM }} \
            --api-id ${{ secrets.API_NAME }} \
            --export-format OpenApiJsonFile \
            --file-path api-template.json
            
      - name: Upload API Template
        uses: actions/upload-artifact@v4
        with:
          name: api-template
          path: api-template.json
