name: Multiple-export-test
# Export multiple D365 solutions from DEV environment
# Unpack, commit to GitHub, and update version online

on:
  workflow_dispatch:
    inputs:
      solutions:
        description: 'Comma-separated list of solutions (e.g. ALMLab,MyOtherSolution)'
        required: true
        default: ALMLab
      solution_exported_folder:
        description: 'Folder name for staging the exported solution *do not change*'
        required: true
        default: out/exported/
      solution_folder:
        description: 'Staging folder for the unpacked solution before check-in *do not change*'
        required: true
        default: out/solutions/
      solution_target_folder: 
        description: 'Folder name to be created and checked in *do not change*'
        required: true
        default: solutions/
      new_solution_version:
        description: 'New solution version to apply in Dataverse (e.g. 1.0.0.5)'
        required: true
        default: 1.0.0.1

env:
  # Edit your values here
  ENVIRONMENT_URL: 'https://operations-gesagenttest.crm4.dynamics.com/'
  CLIENT_ID: '79623805-9f58-4b81-a1aa-81480ca86f44'
  TENANT_ID: '13588042-fe43-45bb-8ce1-83b2e6dd126c'

permissions:
  contents: write

jobs:
  export-from-dev:
    runs-on: windows-latest
    env:
      RUNNER_DEBUG: 1
    strategy:
      matrix:
        solution: ${{ fromJSON(format('["{0}"]', join(inputs.solutions, '","'))) }}

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Install Power Platform Tools
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1
      
      # 3. Verify authentication
      - name: who-am-i
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      # 4. Publish Customizations in DEV
      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      # 5. Export solution
      - name: Export solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ matrix.solution }}
          solution-output-file: ${{ github.event.inputs.solution_exported_folder }}${{ matrix.solution }}.zip

      # 6. Unpack solution
      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: ${{ github.event.inputs.solution_exported_folder }}${{ matrix.solution }}.zip
          solution-folder: ${{ github.event.inputs.solution_folder }}${{ matrix.solution }}
          solution-type: 'Unmanaged'
          overwrite-files: true

      # 7. Set solution version online
      - name: Set Online Solution Version
        uses: microsoft/powerplatform-actions/set-online-solution-version@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          name: ${{ matrix.solution }}
          version: ${{ github.event.inputs.new_solution_version }}

      # 8. Commit & push directly to master
      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ github.event.inputs.solution_target_folder }}
          cp -r ${{ github.event.inputs.solution_folder }}${{ matrix.solution }} ${{ github.event.inputs.solution_target_folder }}
          git add ${{ github.event.inputs.solution_target_folder }}${{ matrix.solution }}
          git commit -m "Exported and updated solution ${{ matrix.solution }} to version ${{ github.event.inputs.new_solution_version }}"
          git push origin master
        shell: bash
