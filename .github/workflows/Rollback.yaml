name: Power Platform PROD Deployment with Rollback
 
on:
  workflow_dispatch: {}
 
env:
  SOLUTION_NAME: "YourSolution"
  NEW_SOLUTION_PATH: "solutions/new-solution.zip"
  BACKUP_FILE: "backup.zip"
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1
 
      - name: Authenticate to Power Platform
        shell: bash
        run: |
          pac auth create \
            --name "prod" \
            --environement "${{ secrets.POWER_PLATFORM_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"
 
          pac auth select --name "prod"
 
      - name: Export current PROD solution
        shell: bash
        run: |
          echo "Exporting solution..."
          pac solution export \
            --name "${{ env.SOLUTION_NAME }}" \
            --path "${{ env.BACKUP_FILE }}" \
            --managed true
 
      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-solution
          path: ${{ env.BACKUP_FILE }}
 
      - name: Import new solution
        id: import_solution
        shell: bash
        run: |
          echo "Importing new solution..."
          pac solution import \
            --path "${{ env.NEW_SOLUTION_PATH }}" \
            --publish-changes true
 
      - name: Validate deployment
        id: validate
        shell: bash
        run: |
          echo "Validating deployment..."
          pac solution list --json > solutions.json
 
          if grep -q "${{ env.SOLUTION_NAME }}" solutions.json; then
            echo "Validation passed"
          else
            echo "Validation failed"
            exit 1
          fi
 
      - name: Download rollback artifact
        if: ${{ failure() }}
        uses: actions/download-artifact@v4
        with:
          name: rollback-solution
 
      - name: Rollback to previous version
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "Rollback triggered..."
          pac solution import \
            --path "${{ env.BACKUP_FILE }}" \
            --publish-changes true
          echo "Rollback completed"
