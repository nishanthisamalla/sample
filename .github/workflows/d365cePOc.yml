name: Power Platform Solution Export / Import

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution name"
        required: true

jobs:
  export-import:
    runs-on: windows-latest
    env:
      SOLUTION_NAME: ${{ github.event.inputs.solution_name }}
      SOURCE_ENV_URL: ${{ secrets.SOURCE_ENV_URL }}
      TARGET_ENV_URL: ${{ secrets.TARGET_ENV_URL }}
      SOURCE_CLIENT_ID: ${{ secrets.SOURCE_CLIENT_ID }}
      SOURCE_TENANT_ID: ${{ secrets.SOURCE_TENANT_ID }}
      SOURCE_CLIENT_SECRET: ${{ secrets.SOURCE_CLIENT_SECRET }}
      TARGET_CLIENT_ID: ${{ secrets.TARGET_CLIENT_ID }}
      TARGET_TENANT_ID: ${{ secrets.TARGET_TENANT_ID }}
      TARGET_CLIENT_SECRET: ${{ secrets.TARGET_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          # (Optional) You can specify version if needed

      - name: Verify PAC CLI Install
        run: pac --version

      - name: Authenticate to Source Env
        run: |
          pac auth create `
            --name sourceEnv `
            --environment $env:SOURCE_ENV_URL `
            --applicationId $env:SOURCE_CLIENT_ID `
            --clientSecret $env:SOURCE_CLIENT_SECRET `
            --tenant $env:SOURCE_TENANT_ID
          pac auth select --name sourceEnv

      - name: Export Solution
        run: |
          pac solution export `
            --name $env:SOLUTION_NAME `
            --path exported_solution.zip `
            --managed false `
            --overwrite

      - name: Upload Exported Solution
        uses: actions/upload-artifact@v4
        with:
          name: exported_solution
          path: exported_solution.zip

      - name: Authenticate to Target Env
        run: |
          pac auth create `
            --name targetEnv `
            --environment $env:TARGET_ENV_URL `
            --applicationId $env:TARGET_CLIENT_ID `
            --clientSecret $env:TARGET_CLIENT_SECRET `
            --tenant $env:TARGET_TENANT_ID
          pac auth select --name targetEnv

      - name: Download Exported Solution
        uses: actions/download-artifact@v4
        with:
          name: exported_solution
          path: .

      - name: Import Solution
        run: |
          pac solution import `
            --path exported_solution.zip `
            --activate-plugins true

