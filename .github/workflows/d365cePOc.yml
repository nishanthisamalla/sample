name: Deploy Solution with PAC CLI (Entra ID Auth)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install PAC CLI directly from Microsoft installer
      - name: Install Power Platform CLI
        run: |
          Invoke-WebRequest -Uri https://aka.ms/paccli -OutFile pac.msi
          Start-Process msiexec.exe -ArgumentList '/i', 'pac.msi', '/quiet', '/qn', '/norestart' -Wait
          $env:PATH += ";$env:ProgramFiles\Microsoft Power Platform CLI"
          pac --version

      # Authenticate to SOURCE environment using Entra ID App Registration
      - name: Authenticate SOURCE environment
        run: |
          pac auth create `
            --name sourceEnv `
            --applicationId $env:SOURCE_CLIENT_ID `
            --clientSecret $env:SOURCE_CLIENT_SECRET `
            --tenant $env:SOURCE_TENANT_ID

      # Authenticate to TARGET environment using Entra ID App Registration
      - name: Authenticate TARGET environment
        run: |
          pac auth create `
            --name targetEnv `
            --applicationId $env:TARGET_CLIENT_ID `
            --clientSecret $env:TARGET_CLIENT_SECRET `
            --tenant $env:TARGET_TENANT_ID

      # Example: Export from SOURCE and import to TARGET
      - name: Export solution from SOURCE
        run: |
          pac auth select --name sourceEnv
          pac solution export --path exported.zip --name MySolution --managed true --overwrite

      - name: Import solution into TARGET
        run: |
          pac auth select --name targetEnv
          pac solution import --path exported.zip --publish-changes true
          
    env:
      SOURCE_CLIENT_ID: ${{ secrets.SOURCE_CLIENT_ID }}
      SOURCE_TENANT_ID: ${{ secrets.SOURCE_TENANT_ID }}
      SOURCE_CLIENT_SECRET: ${{ secrets.SOURCE_CLIENT_SECRET }}
      TARGET_CLIENT_ID: ${{ secrets.TARGET_CLIENT_ID }}
      TARGET_TENANT_ID: ${{ secrets.TARGET_TENANT_ID }}
      TARGET_CLIENT_SECRET: ${{ secrets.TARGET_CLIENT_SECRET }}
