name: Power Platform Solution CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # Or use ubuntu-latest if preferred

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.SOURCE_ENV_URL }}
          user-name: ${{ secrets.SOURCE_USER_NAME }}
          password-secret: ${{ secrets.SOURCE_PASSWORD }}
          solution-name: ${{ secrets.SOLUTION_NAME }}
          solution-output-file: 'aSolution.zip'
          working-directory: 'out'

      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/aSolution.zip'
          solution-folder: 'out/solutions/solution_one'
          solution-type: 'Unmanaged'
          overwrite-files: true

      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: ${{ secrets.TARGET_ENV_URL }}
          user-name: ${{ secrets.TARGET_USER_NAME }}
          password-secret: ${{ secrets.TARGET_PASSWORD }}

      - name: Prepare solution changes for source control
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: 'out/solutions/solution_one'
          solution-target-folder: 'src/solutions/solution1'
          token: ${{ secrets.GITHUB_TOKEN }}
