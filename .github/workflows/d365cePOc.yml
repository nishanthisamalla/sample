name: Power Platform Solution Export/Import

on:
  workflow_dispatch:

env:
  SOURCE_ENV_URL: https://operations-gesagenttest.crm4.dynamics.com/
  TARGET_ENV_URL: https://operations-gescopilottest.crm.dynamics.com/
  SOLUTION_NAME: test
  CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
  TENANT_ID: ${{ secrets.PP_TENANT_ID }}
  CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}

jobs:
  export-import-solution:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install PAC CLI directly from Microsoft installer
      - name: Download PAC CLI Installer
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/powerplatform-vscode-cli" -OutFile pac.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/I pac.msi /quiet /norestart'

      - name: Verify PAC installation
        run: pac --version

      # Authenticate to source environment using Entra ID app
      - name: Auth to source environment
        run: |
          pac auth create `
            --name sourceEnv `
            --url $env:SOURCE_ENV_URL `
            --applicationId $env:CLIENT_ID `
            --tenant $env:TENANT_ID `
            --clientSecret $env:CLIENT_SECRET

      - name: Set active auth profile (source)
        run: pac auth select --name sourceEnv

      - name: Export solution
        run: |
          pac solution export `
            --name $env:SOLUTION_NAME `
            --path exported_solution.zip `
            --managed false `
            --overwrite

      - name: Upload exported solution
        uses: actions/upload-artifact@v4
        with:
          name: exported_solution
          path: exported_solution.zip

      # Authenticate to target environment using Entra ID app
      - name: Auth to target environment
        run: |
          pac auth create `
            --name targetEnv `
            --url $env:TARGET_ENV_URL `
            --applicationId $env:CLIENT_ID `
            --tenant $env:TENANT_ID `
            --clientSecret $env:CLIENT_SECRET

      - name: Set active auth profile (target)
        run: pac auth select --name targetEnv

      - name: Download exported solution
        uses: actions/download-artifact@v4
        with:
          name: exported_solution
          path: .

      - name: Import solution
        run: |
          pac solution import `
            --path exported_solution.zip `
            --overwrite true
