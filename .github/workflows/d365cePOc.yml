name: Power Platform Solution Migration

on:
  workflow_dispatch:

jobs:
  migrate-solution:
    runs-on: windows-latest
    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Install Power Platform CLI
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/setup-pac-cli@v1

      # Authenticate to source environment
      - name: Authenticate Source
        run: |
          pac auth create `
            --environment "<SOURCE_ENV_URL>" `
            --applicationId "${{ secrets.SOURCE_CLIENT_ID }}" `
            --tenant "${{ secrets.SOURCE_TENANT_ID }}" `
            --clientSecret "${{ secrets.SOURCE_CLIENT_SECRET }}"

      # Authenticate to target environment
      - name: Authenticate Target
        run: |
          pac auth create `
            --environment "<TARGET_ENV_URL>" `
            --applicationId "${{ secrets.TARGET_CLIENT_ID }}" `
            --tenant "${{ secrets.TARGET_TENANT_ID }}" `
            --clientSecret "${{ secrets.TARGET_CLIENT_SECRET }}"

      # Export solution from source
      - name: Export Solution
        run: |
          pac solution export `
            --name "test" `
            --path "./test.zip" `
            --managed false

      # Import solution to target
      - name: Import Solution
        run: |
          pac solution import `
            --path "./test.zip"
