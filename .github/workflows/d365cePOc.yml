name: Export Power Platform Solution

on:
  workflow_dispatch:
    inputs:
      solution-name:
        description: 'Name of the solution to export'
        required: true
      output-folder:
        description: 'Folder to place the exported solution zip'
        required: true
        default: 'out/'

jobs:
  export-solution:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.ENVIRONMENT_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution-name }}
          solution-output-file: '${{ github.event.inputs.output-folder }}${{ github.event.inputs.solution-name }}.zip'
          working-directory: ${{ github.event.inputs.output-folder }}
