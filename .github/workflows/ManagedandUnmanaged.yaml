name: export-Managed-Unmanaged-Create-PR
# Export solution from DEV environment
# Unpack it and prepare, push to feature branch, and create a PR

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Name of the solution to work on from Power Platform'
        required: true
        default: ALMLab
        type: choice
        options:
          - test
          - SalesSolution
          - CustomerServiceSolution
          - FinanceSolution
          - HRPortal
      solution_exported_folder:
        description: 'Folder name for staging the exported solution *do not change*'
        required: true
        default: out/exported/
      solution_folder:
        description: 'Staging folder for the unpacked solution before check-in *do not change*'
        required: true
        default: out/solutions/
      solution_target_folder: 
        description: 'Folder name to be created and checked in *do not change*'
        required: true
        default: solutions/
      new_solution_version:
        description: 'New solution version to apply in Dataverse (e.g. 1.0.0.5)'
        required: true
        default: 1.0.0.1
      export_managed:
        description: 'Export managed solution? (true/false)'
        required: false
        default: 'false'
      strategy:
        description: 'Strategy to update patch version (solution, gittags, filetracking)'
        required: false
        default: 'solution'
      tracker_file:
        description: 'Tracker CSV file name if using filetracking strategy'
        required: false
        default: 'ControlsStateVersionInfo.csv'

env:
  ENVIRONMENT_URL: 'https://operations-gesagenttest.crm4.dynamics.com/'
  CLIENT_ID: '79623805-9f58-4b81-a1aa-81480ca86f44'
  TENANT_ID: '13588042-fe43-45bb-8ce1-83b2e6dd126c'

permissions:
  contents: write
  pull-requests: write

jobs:
  export-from-dev:
    runs-on: windows-latest
    env:
      RUNNER_DEBUG: 1

    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      - name: who-am-i
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Publish Solution
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      # 🆕 Added Step to Update Solution Version Before Export
      - name: Update Solution Version (local files)
        uses: ./.github/actions/update-solution-version
        with:
          build-version: '1'
          revision-version: '0'
          patch-version: '0'
          strategy: ${{ github.event.inputs.strategy }}
          tracker-file: ${{ github.event.inputs.tracker_file }}

      - name: Export Unmanaged Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution_name }}
          solution-output-file: ${{ github.event.inputs.solution_exported_folder }}${{ github.event.inputs.solution_name }}-${{ github.event.inputs.new_solution_version }}-Unmanaged.zip
          managed: false

      - name: Export Managed Solution
        if: ${{ github.event.inputs.export_managed == 'true' }}
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution_name }}
          solution-output-file: ${{ github.event.inputs.solution_exported_folder }}${{ github.event.inputs.solution_name }}-${{ github.event.inputs.new_solution_version }}-Managed.zip
          managed: true

      - name: Unpack Unmanaged Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: ${{ github.event.inputs.solution_exported_folder }}${{ github.event.inputs.solution_name }}-Unmanaged.zip
          solution-folder: ${{ github.event.inputs.solution_folder }}${{ github.event.inputs.solution_name }}
          solution-type: 'Unmanaged'
          overwrite-files: true

      - name: Set Online Solution Version
        uses: microsoft/powerplatform-actions/set-online-solution-version@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          name: ${{ github.event.inputs.solution_name }}
          version: ${{ github.event.inputs.new_solution_version }}

      - name: Create feature branch and commit solution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          BRANCH_NAME="export/${{ github.event.inputs.solution_name }}-$TIMESTAMP"
          git checkout -b $BRANCH_NAME

          mkdir -p ${{ github.event.inputs.solution_target_folder }}

          cp -r ${{ github.event.inputs.solution_folder }}${{ github.event.inputs.solution_name }} ${{ github.event.inputs.solution_target_folder }}

          cp ${{ github.event.inputs.solution_exported_folder }}${{ github.event.inputs.solution_name }}-Unmanaged.zip \
             ${{ github.event.inputs.solution_target_folder }}/${{ github.event.inputs.solution_name }}-${{ github.event.inputs.new_solution_version }}-Unmanaged.zip

          if [ "${{ github.event.inputs.export_managed }}" == "true" ]; then
            cp ${{ github.event.inputs.solution_exported_folder }}${{ github.event.inputs.solution_name }}-Managed.zip \
               ${{ github.event.inputs.solution_target_folder }}/${{ github.event.inputs.solution_name }}-${{ github.event.inputs.new_solution_version }}-Managed.zip
          fi

          git add ${{ github.event.inputs.solution_target_folder }}
          git reset .github/workflows/
          git commit -m "Exported and updated solution ${{ github.event.inputs.solution_name }} to version ${{ github.event.inputs.new_solution_version }}"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add exported solution ${{ github.event.inputs.solution_name }}"
          branch: export/${{ github.event.inputs.solution_name }}-${{ env.TIMESTAMP }}
          base: master
          title: "Exported solution ${{ github.event.inputs.solution_name }}"
          body: "Automated export of solution ${{ github.event.inputs.solution_name }} and version ${{ github.event.inputs.new_solution_version }}"
          reviewers: "nishanthisamalla"
