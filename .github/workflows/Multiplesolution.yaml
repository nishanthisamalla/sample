name: export-Managed-Unmanaged-Create-PR (PAC CLI)

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Name of the solution to export from Power Platform'
        required: true
        default: ALMLab
        type: choice
        options:
          - test
          - SalesSolution
          - CustomerServiceSolution
          - FinanceSolution
          - HRPortal
      export_managed:
        description: 'Export managed solution? (true/false)'
        required: false
        default: 'false'

env:
  ENVIRONMENT_URL: 'https://operations-gesagenttest.crm4.dynamics.com/'
  CLIENT_ID: '79623805-9f58-4b81-a1aa-81480ca86f44'
  TENANT_ID: '13588042-fe43-45bb-8ce1-83b2e6dd126c'

permissions:
  contents: write
  pull-requests: write

jobs:
  export-from-dev:
    runs-on: windows-latest

    steps:
      # 🧾 Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Setup .NET (required for pac CLI)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # 🧰 Step 3: Install Power Platform CLI
      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      # 🔐 Step 4: Authenticate with Dataverse (Service Principal)
      - name: Authenticate with Dataverse
        run: |
          pac auth create ^
            --cloud "Public" ^
            --url "${{ env.ENVIRONMENT_URL }}" ^
            --tenant "${{ env.TENANT_ID }}" ^
            --applicationId "${{ env.CLIENT_ID }}" ^
            --clientSecret "${{ secrets.SOURCE_CLIENT_SECRET }}"

      # 🧩 Step 5: Display environment info
      - name: Display Environment Info
        run: pac org who

      # 🚀 Step 6: Publish customizations
      - name: Publish All Customizations
        run: pac solution publish

      # 🔄 Step 7: Automatically increment solution version
      - name: Auto-increment solution version
        id: version
        shell: pwsh
        run: |
          $solution = "${{ github.event.inputs.solution_name }}"
          $json = pac solution list --json | ConvertFrom-Json
          $current = ($json | Where-Object { $_.uniqueName -eq $solution }).version
          Write-Host "Current version: $current"

          # Split version components
          $parts = $current -split '\.'
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $build = [int]$parts[2]
          $revision = [int]$parts[3] + 1
          $newVersion = "$major.$minor.$build.$revision"

          Write-Host "New version: $newVersion"
          pac solution version --name $solution --version $newVersion
          echo "newVersion=$newVersion" >> $env:GITHUB_ENV

      # 📦 Step 8: Export Unmanaged Solution
      - name: Export Unmanaged Solution
        run: |
          mkdir -p out/exported
          pac solution export ^
            --name "${{ github.event.inputs.solution_name }}" ^
            --path "out/exported/${{ github.event.inputs.solution_name }}-${{ env.newVersion }}-Unmanaged.zip" ^
            --managed false ^
            --overwrite true

      # 📦 Step 9: Export Managed Solution (conditional)
      - name: Export Managed Solution
        if: ${{ github.event.inputs.export_managed == 'true' }}
        run: |
          pac solution export ^
            --name "${{ github.event.inputs.solution_name }}" ^
            --path "out/exported/${{ github.event.inputs.solution_name }}-${{ env.newVersion }}-Managed.zip" ^
            --managed true ^
            --overwrite true

      # 🔓 Step 10: Unpack Unmanaged Solution for source control
      - name: Unpack Unmanaged Solution
        run: |
          mkdir -p out/solutions/${{ github.event.inputs.solution_name }}
          pac solution unpack ^
            --zipFile "out/exported/${{ github.event.inputs.solution_name }}-${{ env.newVersion }}-Unmanaged.zip" ^
            --folder "out/solutions/${{ github.event.inputs.solution_name }}" ^
            --overwrite true

      # 💾 Step 11: Commit and push changes to new branch
      - name: Commit and Push Solution Changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="export/${{ github.event.inputs.solution_name }}-$TIMESTAMP"

          git checkout -b $BRANCH_NAME
          mkdir -p solutions/
          cp -r out/solutions/${{ github.event.inputs.solution_name }} solutions/
          cp out/exported/${{ github.event.inputs.solution_name }}-${{ env.newVersion }}-Unmanaged.zip solutions/

          if [ "${{ github.event.inputs.export_managed }}" == "true" ]; then
            cp out/exported/${{ github.event.inputs.solution_name }}-${{ env.newVersion }}-Managed.zip solutions/
          fi

          git add solutions/
          git commit -m "Exported ${{ github.event.inputs.solution_name }} v${{ env.newVersion }}"
          git push origin $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # 🔀 Step 12: Create Pull Request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: master
          title: "Exported solution ${{ github.event.inputs.solution_name }} v${{ env.newVersion }}"
          body: |
            Automated export using PAC CLI  
            - Solution: **${{ github.event.inputs.solution_name }}**  
            - Version: **${{ env.newVersion }}**
          reviewers: "nishanthisamalla"
