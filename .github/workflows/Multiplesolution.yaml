name: export-all-d365-solutions

on:
  workflow_dispatch:
    inputs:
      skip_solution1:
        description: 'Skip exporting Solution1'
        required: false
        type: boolean
        default: false
      skip_solution2:
        description: 'Skip exporting Solution2'
        required: false
        type: boolean
        default: false
      skip_solution3:
        description: 'Skip exporting Solution3'
        required: false
        type: boolean
        default: false
      skip_solution4:
        description: 'Skip exporting Solution4'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Define solution metadata
        id: meta
        run: |
          echo "solutions=('Solution1' 'Solution2' 'Solution3' 'Solution4')" >> $GITHUB_ENV
          echo "managed_solutions=('Solution1' 'Solution3')" >> $GITHUB_ENV
          echo "unmanaged_only_solutions=('Solution2' 'Solution4')" >> $GITHUB_ENV

      - name: Export all solutions
        shell: bash
        run: |
          mkdir -p ./Solutions

          # Convert GitHub input booleans to shell vars
          SKIP_SOLUTION1="${{ github.event.inputs.skip_solution1 }}"
          SKIP_SOLUTION2="${{ github.event.inputs.skip_solution2 }}"
          SKIP_SOLUTION3="${{ github.event.inputs.skip_solution3 }}"
          SKIP_SOLUTION4="${{ github.event.inputs.skip_solution4 }}"

          for SOL in "${solutions[@]}"; do
            echo "🔹 Processing solution: $SOL"

            # Map skip flags manually
            if [[ "$SOL" == "Solution1" && "$SKIP_SOLUTION1" == "true" ]]; then echo "⏭️ Skipping $SOL"; continue; fi
            if [[ "$SOL" == "Solution2" && "$SKIP_SOLUTION2" == "true" ]]; then echo "⏭️ Skipping $SOL"; continue; fi
            if [[ "$SOL" == "Solution3" && "$SKIP_SOLUTION3" == "true" ]]; then echo "⏭️ Skipping $SOL"; continue; fi
            if [[ "$SOL" == "Solution4" && "$SKIP_SOLUTION4" == "true" ]]; then echo "⏭️ Skipping $SOL"; continue; fi

            # Clean previous exports
            rm -rf "./Solutions/${SOL}"* || true

            echo "🔢 Incrementing version for $SOL..."
            pwsh -Command "microsoft/powerplatform-actions/update-solution-version@v1 \
              -environment-url '${{ secrets.PP_ENVIRONMENT_URL }}' \
              -user-name '${{ secrets.PP_USER }}' \
              -password-secret '${{ secrets.PP_PASSWORD }}' \
              -solution-name '$SOL' \
              -strategy 'increment'"

            # Export managed first if applicable
            if [[ " ${managed_solutions[@]} " =~ " ${SOL} " ]]; then
              echo "📦 Exporting managed $SOL..."
              pwsh -Command "microsoft/powerplatform-actions/export-solution@v1 \
                -environment-url '${{ secrets.PP_ENVIRONMENT_URL }}' \
                -user-name '${{ secrets.PP_USER }}' \
                -password-secret '${{ secrets.PP_PASSWORD }}' \
                -solution-name '$SOL' \
                -managed true \
                -path './Solutions/${SOL}_Managed.zip'"
            fi

            # Export unmanaged
            echo "📦 Exporting unmanaged $SOL..."
            pwsh -Command "microsoft/powerplatform-actions/export-solution@v1 \
              -environment-url '${{ secrets.PP_ENVIRONMENT_URL }}' \
              -user-name '${{ secrets.PP_USER }}' \
              -password-secret '${{ secrets.PP_PASSWORD }}' \
              -solution-name '$SOL' \
              -managed false \
              -path './Solutions/${SOL}.zip'"

            # Unpack
            echo "📂 Unpacking $SOL..."
            pwsh -Command "microsoft/powerplatform-actions/unpack-solution@v1 \
              -solution-file './Solutions/${SOL}.zip' \
              -folder './Solutions/${SOL}'"
          done

      - name: Commit and push all exports
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add ./Solutions/*
          git commit -m "Automated export of all D365 solutions - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin HEAD:feature/solutions-export-${{ github.run_number }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: feature/solutions-export-${{ github.run_number }}
          title: "Automated Export of All D365 Solutions"
          body: "All managed/unmanaged solutions exported and version auto-incremented."
          labels: |
            automated
            export
