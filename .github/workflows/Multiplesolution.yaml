name: export-all-d365-solutions

on:
  workflow_dispatch:
    inputs:
      skip_solution1:
        description: 'Skip exporting Solution1'
        required: false
        type: boolean
        default: false
      skip_solution2:
        description: 'Skip exporting Solution2'
        required: false
        type: boolean
        default: false
      skip_solution3:
        description: 'Skip exporting Solution3'
        required: false
        type: boolean
        default: false
      skip_solution4:
        description: 'Skip exporting Solution4'
        required: false
        type: boolean
        default: false

# 🚫 No push or PR triggers — manual only
# Ensures no PR or schedule auto-runs
permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional identity check
      - name: Who Am I (Optional)
        continue-on-error: true
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          user-name: ${{ secrets.PP_USER }}
          password-secret: ${{ secrets.PP_PASSWORD }}

      # 🧭 Define managed/unmanaged metadata
      - name: Define solution metadata
        id: meta
        run: |
          echo "solutions=Solution1 Solution2 Solution3 Solution4" >> $GITHUB_ENV
          echo "managed_solutions=Solution1 Solution3" >> $GITHUB_ENV
          echo "unmanaged_only_solutions=Solution2 Solution4" >> $GITHUB_ENV

      # ⚙️ Loop through and export all solutions
      - name: Export all solutions
        shell: bash
        run: |
          mkdir -p ./Solutions

          for SOL in $solutions; do
            SKIP_VAR="skip_${SOL,,}"
            if [ "${{ github.event.inputs[SKIP_VAR] }}" = "true" ]; then
              echo "⏭️ Skipping $SOL"
              continue
            fi

            echo "🚀 Processing $SOL..."

            # Clean existing exports
            rm -rf ./Solutions/${SOL}* || true

            # 🔢 Increment solution version using official action
            echo "🔄 Updating version for $SOL..."
            gh workflow run microsoft/powerplatform-actions/update-solution-version@v1 \
              --env environment-url="${{ secrets.PP_ENVIRONMENT_URL }}" \
              --env user-name="${{ secrets.PP_USER }}" \
              --env password-secret="${{ secrets.PP_PASSWORD }}" \
              --env solution-name="$SOL" \
              --env strategy="increment"

            # Export managed first if applicable
            if [[ " $managed_solutions " =~ " $SOL " ]]; then
              echo "📦 Exporting managed $SOL..."
              npx microsoft/powerplatform-actions export-solution@v1 \
                --environment-url "${{ secrets.PP_ENVIRONMENT_URL }}" \
                --user-name "${{ secrets.PP_USER }}" \
                --password-secret "${{ secrets.PP_PASSWORD }}" \
                --solution-name "$SOL" \
                --managed true \
                --path "./Solutions/${SOL}_Managed.zip"
            fi

            # Export unmanaged
            echo "📦 Exporting unmanaged $SOL..."
            npx microsoft/powerplatform-actions export-solution@v1 \
              --environment-url "${{ secrets.PP_ENVIRONMENT_URL }}" \
              --user-name "${{ secrets.PP_USER }}" \
              --password-secret "${{ secrets.PP_PASSWORD }}" \
              --solution-name "$SOL" \
              --managed false \
              --path "./Solutions/${SOL}.zip"

            # Unpack the unmanaged ZIP
            echo "📂 Unpacking $SOL..."
            npx microsoft/powerplatform-actions unpack-solution@v1 \
              --solution-file "./Solutions/${SOL}.zip" \
              --folder "./Solutions/${SOL}"

          done

      # 📦 Commit all exports after loop completes
      - name: Commit and push all exports
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add ./Solutions/*
          git commit -m "Automated export of all solutions on $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:feature/solutions-export-${{ github.run_number }}

      # 🔀 Create PR after all exports
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: feature/solutions-export-${{ github.run_number }}
          title: "Automated Export of All D365 Solutions"
          body: "This PR includes exported managed/unmanaged solutions with auto-incremented versions."
          labels: |
            automated
            export
