name: Create UDE (OIDC + Async)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create-ude:
    name: Create UDE Sandbox Environment
    runs-on: ubuntu-latest
    timeout-minutes: 20   # async returns immediately

    steps:
      # ----------------------------------------
      # Checkout Repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Install Power Platform CLI
      # ----------------------------------------
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      # ----------------------------------------
      # Authenticate using OIDC (Federated Credentials)
      # ----------------------------------------
      - name: Authenticate to Power Platform
        uses: microsoft/powerplatform-actions/authenticate@v1.9.1
        with:
          app-id: ${{ secrets.PP_CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      # ----------------------------------------
      # Create UDE Environment (Async)
      # ----------------------------------------
      - name: Create UDE Environment (Async)
        run: |
          pac admin create \
            --name "fotest-ude-dev01" \
            --type Sandbox \
            --region unitedstates \
            --currency USD \
            --language 1033 \
            --domain ude-dev01 \
            --templates D365_FinOps_Finance \
            --template-metadata-json '{
              "PostProvisioningPackages": [
                {
                  "applicationUniqueName": "msdyn_FinanceAndOperationsProvisioningAppAnchor",
                  "parameters": "DevToolsEnabled=true|DemoDataEnabled=true"
                }
              ]
            }' \
            --async

      # ----------------------------------------
      # Optional: List Environments for Verification
      # ----------------------------------------
      - name: List Environments
        run: pac admin list
