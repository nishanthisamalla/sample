          SOLUTIONS='${{ github.event.inputs.solution_names }}'
          MANAGED='${{ github.event.inputs.managed_solution_names }}'
          PUBLISH='${{ github.event.inputs.publish_changes }}'

          for SOL in $(echo "$SOLUTIONS" | jq -r '.[]'); do
            echo "::group::Import to SIT-CE-FIN-03: $SOL"
            ZIP="Solutions/${SOL}.zip"
            if echo "$MANAGED" | jq -e --arg s "$SOL" 'index($s) != null' >/dev/null; then
              [[ -f "Solutions/${SOL}_managed.zip" ]] && ZIP="Solutions/${SOL}_managed.zip"
            fi
            [[ -f "$ZIP" ]] || { echo "ERROR: $ZIP not found"; exit 1; }
            pac solution import --path "$ZIP"
            [[ "$PUBLISH" == "true" ]] && pac solution publish
            echo "::endgroup::"
          done

  # ---------------- SIT-CE-03 ----------------
  import-sit-ce-03:
    name: Import → SIT-CE-03
    if: ${{ github.event.inputs.skip_sit_ce_03 != 'true' }}
    runs-on: ubuntu-latest
    environment: SIT-CE-03
    needs: [import-sit-ce-fin-03]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name }}

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.1
        with:
          add-tools-to-path: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Authenticate SIT-CE-03
        run: |
          pac auth create --name SIT-CE-03-auth \
