            fi
            [[ -f "$ZIP" ]] || { echo "ERROR: $ZIP not found"; exit 1; }
            pac solution import --path "$ZIP"
            [[ "$PUBLISH" == "true" ]] && pac solution publish
            echo "::endgroup::"
          done
