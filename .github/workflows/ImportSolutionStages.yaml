name: Multi-Environment Import Solution

# Trigger: When changes are merged to master
on:
  push:
    branches:
      - master

env:
  CLIENT_ID: 'YOUR-CLIENT-ID-HERE'
  TENANT_ID: 'YOUR-TENANT-ID-HERE'

permissions:
  contents: read
  id-token: write

jobs:

  import-fut:
    name: Import to FUT
    runs-on: windows-latest
    environment: FUT  # GitHub Environment with optional reviewers for approval
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      - name: who-am-i FUT
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: 'https://futenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.FUT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Import Unmanaged Solution FUT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://futenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.FUT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Unmanaged.zip'
          overwrite-unmanaged-customizations: true
          import-as-managed: false
          publish-workflows: true

      - name: Import Managed Solution FUT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://futenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.FUT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Managed.zip'
          import-as-managed: true
          publish-workflows: true

  import-sit:
    name: Import to SIT
    needs: import-fut
    runs-on: windows-latest
    environment: SIT  # Requires manual approval from reviewers
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      - name: who-am-i SIT
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: 'https://sitenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SIT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Import Unmanaged Solution SIT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://sitenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SIT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Unmanaged.zip'
          overwrite-unmanaged-customizations: true
          import-as-managed: false
          publish-workflows: true

      - name: Import Managed Solution SIT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://sitenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.SIT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Managed.zip'
          import-as-managed: true
          publish-workflows: true

  import-uat:
    name: Import to UAT
    needs: import-sit
    runs-on: windows-latest
    environment: UAT  # Requires manual approval from reviewers
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      - name: who-am-i UAT
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: 'https://uatenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.UAT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Import Unmanaged Solution UAT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://uatenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.UAT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Unmanaged.zip'
          overwrite-unmanaged-customizations: true
          import-as-managed: false
          publish-workflows: true

      - name: Import Managed Solution UAT
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://uatenv.crm4.dynamics.com/'
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.UAT_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: './solutions/YOUR_SOLUTION_NAME-Managed.zip'
          import-as-managed: true
          publish-workflows: true
