name: Create Power Platform Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-env:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1


      - name: Create Power Platform Environment
        uses: microsoft/powerplatform-actions/create-environment@v1
        with:
          environment-name: 'MyNewEnvironment'
          environment-type: 'Sandbox'        # e.g., Sandbox, Production
          region: 'North America'            # change as needed
          admin-username: ${{ secrets.PP_ADMIN_USERNAME }}
          admin-password: ${{ secrets.PP_ADMIN_PASSWORD }}
          location: 'avanadeD365.onmicrosoft.com'  # e.g., tenant or org domain
          display-name: 'Github'
          purpose: 'Development testing'
          # Optional: additional inputs if supported by the action

