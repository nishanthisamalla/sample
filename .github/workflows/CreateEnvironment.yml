name: CreateEnvironment

on:
  workflow_dispatch:    # allow for manual workflow triggering as needed
  release:
    types: [created]

jobs:
  convert-to-managed:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: 1
      WF_CLOUD: Public
      WF_USERNAME: nishanth@avanadeD365.onmicrosoft.com
      password: PASSWORD_PPDEVTOOLS
      WF_APPID: 79623805-9f58-4b81-a1aa-81480ca86f44
      WF_TENANT_ID: 13588042-fe43-45bb-8ce1-83b2e6dd126c
      client secret: SOURCE_CLIENT_SECRET

    steps:
    - uses: actions/checkout@v2
      with:
        lfs: true
        
    - name: create ephemeral test environment
      uses: microsoft/powerplatform-actions/create-environment@v1
      id: test-environment
      env:
        PP_SRC_ENV_NAME: ${{ format('dj-rel-{0}', runner.os) }}
      with:
        cloud: ${{ env.WF_CLOUD }}
        user-name: ${{ env.WF_USERNAME }}
        password-secret: ${{ secrets.PASSWORD_PPDEVTOOLS }}
        app-id: ${{ env.WF_APPID }}
        tenant-id: ${{ env.WF_TENANT_ID }}
        lient-secret: ${{ secrets.SOURCE_CLIENT_SECRET }}
        name: ${{ env.PP_SRC_ENV_NAME }}
        type: Sandbox
        region: unitedstates
        domain: ${{ env.PP_SRC_ENV_NAME }}
