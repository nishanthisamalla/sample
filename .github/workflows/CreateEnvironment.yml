name: Create Power Platform Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-env:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      - name: Create Power Platform Environment
        uses: microsoft/powerplatform-actions/create-environment@v1
        with:
          # --- Authentication (Service Principal) ---
          app-id: 5d24666c-1453-4140-bed7-54d579b25ad7
          #client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: 6fad243e-c43c-4f8e-a920-1d0f77023908

          # --- Environment Properties ---
          name: GitTest                 # Unique environment name
          type: Sandbox                 # Options: Sandbox | Production | Trial
          region: northamerica          # e.g., northamerica, europe, unitedkingdom
          domain: gittest               # Must be a unique subdomain

          # --- Optional Properties ---
          currency: USD
          language: 1033                # English
          # templates: CDS
          # user: ${{ secrets.PP_ADMIN_USERNAME }} # Optional: Owner (UPN) of environment
          # team-id: <AzureAD-Team-GUID>
          # security-group-id: <AAD-SecurityGroup-GUID>
